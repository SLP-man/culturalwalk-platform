[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# DB URL comes from the DATABASE_URL env var; never hard-code it here.
# NOTE: keep this file pure ASCII -- Alembic reads it with the system locale
# encoding, so a Chinese comment breaks startup on zh-CN Windows (GBK).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
