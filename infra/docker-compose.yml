# 本地依赖：数据库 + 对象存储。应用本身在宿主机跑，改代码即时生效。
# 用法：docker compose -f infra/docker-compose.yml up -d
name: culturalwalk

services:
  db:
    image: postgres:16-alpine
    container_name: cw-db
    environment:
      POSTGRES_USER: cw
      POSTGRES_PASSWORD: cw
      POSTGRES_DB: culturalwalk
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cw-pg:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cw -d culturalwalk"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: cw-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - cw-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 建桶脚本：只跑一次，给隔离区和清洁区各建一个
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/culturalwalk;
      mc mb --ignore-existing local/culturalwalk-quarantine;
      echo 'buckets ready';
      "
    restart: "no"

volumes:
  cw-pg:
  cw-minio:
